<svg viewBox="0 0 1280 990" width="1280" height="990" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="InfoBridge end-to-end block diagram: offline indexing, runtime question answering with hybrid retrieval, and evaluation harness">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .lane-offline { fill: #fff1d6; stroke: #e3b35a; stroke-width: 1.5; }
      .lane-runtime { fill: #e9f7ee; stroke: #6fb68a; stroke-width: 1.5; }
      .lane-eval { fill: #f1ecfb; stroke: #9b86d1; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #8fa4c9; stroke-width: 1.2; }
      .node-gate { fill: #fff7ec; stroke: #e08a2e; stroke-width: 1.6; }
      .node-refuse { fill: #fdeeee; stroke: #d46a6a; stroke-width: 1.2; }
      .node-result { fill: #eef3ff; stroke: #2f5dff; stroke-width: 1.4; }
      .title { font: 700 16px Arial, Helvetica, sans-serif; fill: #1a2336; }
      .group { font: 700 11px Arial, Helvetica, sans-serif; fill: #4a5a7a; letter-spacing: 0.5px; }
      .txt { font: 600 11px Arial, Helvetica, sans-serif; fill: #1a2336; text-anchor: middle; dominant-baseline: middle; }
      .sub { font: 500 10px Arial, Helvetica, sans-serif; fill: #2f3d59; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #2f5dff; stroke-width: 1.8; fill: none; marker-end: url(#arrowHead); }
      .arrow-dash { stroke: #2f5dff; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowHead); }
      .arrow-red { stroke: #d46a6a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowHeadRed); }
      .note { font: 500 10px Arial, Helvetica, sans-serif; fill: #4a5a7a; }
      .note-red { font: 600 10px Arial, Helvetica, sans-serif; fill: #b54848; }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5dff" />
    </marker>
    <marker id="arrowHeadRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d46a6a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="990" class="bg"/>

  <!-- ============ Lanes ============ -->
  <rect x="16" y="20" width="1248" height="200" rx="12" class="lane-offline"/>
  <rect x="16" y="240" width="1248" height="560" rx="12" class="lane-runtime"/>
  <rect x="16" y="820" width="1248" height="155" rx="12" class="lane-eval"/>
  <text x="34" y="45" class="title">Offline Indexing Pipeline (build once, rebuild when PDFs change)</text>
  <text x="34" y="265" class="title">Runtime QA Pipeline (executes for each user query)</text>
  <text x="34" y="845" class="title">Evaluation Harness (eval/, run offline after each change)</text>

  <!-- ============ Offline indexing ============ -->
  <rect x="40" y="75" width="150" height="70" rx="8" class="node"/>
  <text x="115" y="101" class="txt">PDFs by service</text>
  <text x="115" y="117" class="sub">data/passport … health</text>
  <text x="115" y="131" class="sub">5 services</text>

  <rect x="220" y="75" width="180" height="70" rx="8" class="node"/>
  <text x="310" y="101" class="txt">PDF Extractor</text>
  <text x="310" y="117" class="sub">PyMuPDF + Tesseract OCR</text>
  <text x="310" y="131" class="sub">+ text cleanup</text>

  <rect x="430" y="75" width="200" height="70" rx="8" class="node"/>
  <text x="530" y="101" class="txt">Chunker</text>
  <text x="530" y="117" class="sub">500 / 100 overlap, ≥ 5 words</text>
  <text x="530" y="131" class="sub">+ title, AY / date metadata</text>

  <rect x="660" y="75" width="190" height="70" rx="8" class="node"/>
  <text x="755" y="101" class="txt">Embedder</text>
  <text x="755" y="117" class="sub">multilingual-e5-small</text>
  <text x="755" y="131" class="sub">384-d, normalized (EN + HI)</text>

  <rect x="880" y="75" width="150" height="70" rx="8" class="node"/>
  <text x="955" y="101" class="txt">FAISS</text>
  <text x="955" y="117" class="sub">IndexFlatIP</text>
  <text x="955" y="131" class="sub">(cosine similarity)</text>

  <rect x="1060" y="75" width="185" height="70" rx="8" class="node"/>
  <text x="1152" y="101" class="txt">Saved index</text>
  <text x="1152" y="117" class="sub">faiss_index.bin</text>
  <text x="1152" y="131" class="sub">metadata.pkl (+ model name)</text>

  <path d="M190 110 L220 110" class="arrow"/>
  <path d="M400 110 L430 110" class="arrow"/>
  <path d="M630 110 L660 110" class="arrow"/>
  <path d="M850 110 L880 110" class="arrow"/>
  <path d="M1030 110 L1060 110" class="arrow"/>

  <path d="M1152 145 L1152 277 L305 277 L305 290" class="arrow"/>
  <text x="1162" y="200" class="note">loaded once at startup</text>

  <!-- ============ Runtime row A: query understanding ============ -->
  <text x="40" y="284" class="group">1 · QUERY UNDERSTANDING</text>

  <rect x="40" y="290" width="150" height="70" rx="8" class="node"/>
  <text x="115" y="316" class="txt">User query</text>
  <text x="115" y="332" class="sub">Streamlit chat input</text>
  <text x="115" y="346" class="sub">English / Hindi</text>

  <rect x="220" y="290" width="170" height="70" rx="8" class="node"/>
  <text x="305" y="316" class="txt">Load pipeline (cached)</text>
  <text x="305" y="332" class="sub">FAISS + BM25 index</text>
  <text x="305" y="346" class="sub">+ reranker model</text>

  <rect x="420" y="290" width="170" height="70" rx="8" class="node"/>
  <text x="505" y="316" class="txt">General query check</text>
  <text x="505" y="332" class="sub">greeting / thanks</text>
  <text x="505" y="346" class="sub">fast path, no retrieval</text>

  <rect x="620" y="290" width="190" height="70" rx="8" class="node"/>
  <text x="715" y="316" class="txt">Guardrails</text>
  <text x="715" y="332" class="sub">prompt-injection refusal</text>
  <text x="715" y="346" class="sub">Aadhaar / PAN / phone redaction</text>

  <rect x="840" y="290" width="200" height="70" rx="8" class="node"/>
  <text x="940" y="316" class="txt">Query processor</text>
  <text x="940" y="332" class="sub">follow-up rewrite (last 3 turns)</text>
  <text x="940" y="346" class="sub">Hindi → English, service routing</text>

  <path d="M190 325 L220 325" class="arrow"/>
  <path d="M390 325 L420 325" class="arrow"/>
  <path d="M590 325 L620 325" class="arrow"/>
  <path d="M810 325 L840 325" class="arrow"/>

  <!-- ============ Runtime row B: hybrid retrieval ============ -->
  <text x="40" y="402" class="group">2 · HYBRID RETRIEVAL</text>

  <path d="M940 360 L940 385 L30 385 L30 437 L40 437" class="arrow"/>
  <path d="M30 437 L30 502 L40 502" class="arrow"/>

  <rect x="40" y="410" width="170" height="55" rx="8" class="node"/>
  <text x="125" y="430" class="txt">BM25 keyword search</text>
  <text x="125" y="447" class="sub">top 30 candidates</text>

  <rect x="40" y="475" width="170" height="55" rx="8" class="node"/>
  <text x="125" y="495" class="txt">FAISS dense search</text>
  <text x="125" y="512" class="sub">e5 query embedding, top 30</text>

  <rect x="250" y="430" width="170" height="70" rx="8" class="node"/>
  <text x="335" y="456" class="txt">RRF fusion</text>
  <text x="335" y="472" class="sub">Reciprocal Rank Fusion, k = 60</text>
  <text x="335" y="486" class="sub">+ service filter</text>

  <rect x="450" y="430" width="190" height="70" rx="8" class="node"/>
  <text x="545" y="456" class="txt">Cross-encoder rerank</text>
  <text x="545" y="472" class="sub">ms-marco-MiniLM-L-6-v2</text>
  <text x="545" y="486" class="sub">30 candidates → top 5</text>

  <rect x="670" y="430" width="190" height="70" rx="8" class="node-gate"/>
  <text x="765" y="456" class="txt">Answerable gate</text>
  <text x="765" y="472" class="sub">best rerank score</text>
  <text x="765" y="486" class="sub">≥ MIN_RERANK_SCORE (0.30)?</text>

  <rect x="670" y="530" width="190" height="50" rx="8" class="node-refuse"/>
  <text x="765" y="549" class="txt">Polite refusal</text>
  <text x="765" y="565" class="sub">"not enough information"</text>

  <rect x="890" y="430" width="180" height="70" rx="8" class="node"/>
  <text x="980" y="456" class="txt">Context selection</text>
  <text x="980" y="472" class="sub">≤ 3 chunks per PDF, 6000 chars</text>
  <text x="980" y="486" class="sub">newer edition preferred</text>

  <rect x="1100" y="430" width="145" height="70" rx="8" class="node"/>
  <text x="1172" y="456" class="txt">Prompt</text>
  <text x="1172" y="472" class="sub">numbered context [1]…[n]</text>
  <text x="1172" y="486" class="sub">EN/HI rules + history</text>

  <path d="M210 437 L250 455" class="arrow"/>
  <path d="M210 502 L250 476" class="arrow"/>
  <path d="M420 465 L450 465" class="arrow"/>
  <path d="M640 465 L670 465" class="arrow"/>
  <path d="M860 465 L890 465" class="arrow"/>
  <text x="866" y="456" class="note">yes</text>
  <path d="M1070 465 L1100 465" class="arrow"/>
  <path d="M765 500 L765 530" class="arrow-red"/>
  <text x="772" y="519" class="note-red">no</text>

  <!-- ============ Runtime row C: generation ============ -->
  <text x="150" y="613" class="group">3 · GENERATION &amp; GROUNDING</text>

  <path d="M1172 500 L1172 595 L130 595 L130 620" class="arrow"/>

  <rect x="40" y="620" width="180" height="75" rx="8" class="node"/>
  <text x="130" y="645" class="txt">Gemini LLM</text>
  <text x="130" y="662" class="sub">primary + fallback models</text>
  <text x="130" y="677" class="sub">(Groq optional)</text>

  <rect x="260" y="620" width="180" height="75" rx="8" class="node"/>
  <text x="350" y="645" class="txt">Language enforcer</text>
  <text x="350" y="662" class="sub">rewrite if answer language</text>
  <text x="350" y="677" class="sub">≠ selected (EN / HI)</text>

  <rect x="480" y="620" width="210" height="75" rx="8" class="node"/>
  <text x="585" y="645" class="txt">Citation builder</text>
  <text x="585" y="662" class="sub">[n] → PDF name + page link</text>
  <text x="585" y="677" class="sub">support check per sentence</text>

  <rect x="730" y="620" width="180" height="75" rx="8" class="node"/>
  <text x="820" y="645" class="txt">UI render</text>
  <text x="820" y="662" class="sub">answer + sources</text>
  <text x="820" y="677" class="sub">unsupported lines flagged</text>

  <rect x="950" y="620" width="150" height="75" rx="8" class="node"/>
  <text x="1025" y="645" class="txt">Conversation memory</text>
  <text x="1025" y="662" class="sub">last 10 turns</text>

  <rect x="40" y="725" width="180" height="55" rx="8" class="node"/>
  <text x="130" y="745" class="txt">Fallback snippets</text>
  <text x="130" y="762" class="sub">top document excerpts shown</text>

  <path d="M220 657 L260 657" class="arrow"/>
  <path d="M440 657 L480 657" class="arrow"/>
  <path d="M690 657 L730 657" class="arrow"/>
  <path d="M910 657 L950 657" class="arrow"/>
  <path d="M800 580 L800 620" class="arrow-red"/>
  <path d="M130 695 L130 725" class="arrow-dash"/>
  <text x="138" y="713" class="note">if LLM unavailable / quota hit</text>
  <path d="M220 752 L820 752 L820 695" class="arrow-dash"/>

  <path d="M1100 657 L1255 657 L1255 325 L1040 325" class="arrow-dash"/>
  <text x="1150" y="648" class="note">history for rewrite</text>

  <!-- ============ Evaluation harness ============ -->
  <rect x="40" y="865" width="220" height="75" rx="8" class="node"/>
  <text x="150" y="889" class="txt">generate_datasets.py</text>
  <text x="150" y="906" class="sub">200 synthetic + 30 Hindi</text>
  <text x="150" y="921" class="sub">30 follow-up + 50 unanswerable</text>

  <rect x="290" y="865" width="200" height="75" rx="8" class="node"/>
  <text x="390" y="889" class="txt">run_eval.py</text>
  <text x="390" y="906" class="sub">one preset per phase</text>
  <text x="390" y="921" class="sub">baseline → full pipeline</text>

  <rect x="520" y="865" width="270" height="75" rx="8" class="node"/>
  <text x="655" y="889" class="txt">Metrics</text>
  <text x="655" y="906" class="sub">Hit@k, MRR, nDCG, refusal rates, latency</text>
  <text x="655" y="921" class="sub">LLM judge: faithfulness, relevance, correctness</text>

  <rect x="820" y="865" width="200" height="75" rx="8" class="node"/>
  <text x="920" y="889" class="txt">compare.py</text>
  <text x="920" y="906" class="sub">ablation table</text>
  <text x="920" y="921" class="sub">+ pairwise A/B win rate</text>

  <rect x="1050" y="865" width="195" height="75" rx="8" class="node-result"/>
  <text x="1147" y="889" class="txt">Full vs baseline</text>
  <text x="1147" y="906" class="sub">Hit@5 0.52 → 0.78</text>
  <text x="1147" y="921" class="sub">MRR 0.45 → 0.63</text>

  <path d="M260 902 L290 902" class="arrow"/>
  <path d="M490 902 L520 902" class="arrow"/>
  <path d="M790 902 L820 902" class="arrow"/>
  <path d="M1020 902 L1050 902" class="arrow"/>
</svg>
