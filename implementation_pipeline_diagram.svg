<svg viewBox="0 0 1280 760" width="1280" height="760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="InfoBridge end-to-end block diagram">
  <defs>
    <style>
      .lane-offline { fill: #fff1d6; stroke: #e3b35a; stroke-width: 1.5; }
      .lane-runtime { fill: #e9f7ee; stroke: #6fb68a; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #8fa4c9; stroke-width: 1.2; }
      .title { font: 700 16px Arial, Helvetica, sans-serif; fill: #1a2336; }
      .txt { font: 600 11px Arial, Helvetica, sans-serif; fill: #1a2336; text-anchor: middle; dominant-baseline: middle; }
      .sub { font: 500 10px Arial, Helvetica, sans-serif; fill: #2f3d59; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #2f5dff; stroke-width: 1.8; fill: none; marker-end: url(#arrowHead); }
      .note { font: 500 10px Arial, Helvetica, sans-serif; fill: #4a5a7a; }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5dff" />
    </marker>
  </defs>

  <rect x="16" y="20" width="1248" height="280" rx="12" class="lane-offline"/>
  <rect x="16" y="320" width="1248" height="420" rx="12" class="lane-runtime"/>
  <text x="34" y="45" class="title">Offline Indexing Pipeline (build once, rebuild when PDFs change)</text>
  <text x="34" y="345" class="title">Runtime QA Pipeline (executes for each user query)</text>

  <rect x="40" y="90" width="140" height="62" rx="8" class="node"/>
  <text x="110" y="118" class="txt">PDFs by service</text>
  <text x="110" y="133" class="sub">data/passport...health</text>

  <rect x="210" y="90" width="160" height="62" rx="8" class="node"/>
  <text x="290" y="118" class="txt">PDF Extractor</text>
  <text x="290" y="133" class="sub">PyMuPDF + OCR fallback</text>

  <rect x="400" y="90" width="150" height="62" rx="8" class="node"/>
  <text x="475" y="118" class="txt">Text cleanup</text>
  <text x="475" y="133" class="sub">regex normalization</text>

  <rect x="580" y="90" width="190" height="62" rx="8" class="node"/>
  <text x="675" y="118" class="txt">Chunker</text>
  <text x="675" y="133" class="sub">Recursive splitter 500/100</text>

  <rect x="800" y="90" width="180" height="62" rx="8" class="node"/>
  <text x="890" y="118" class="txt">Embedder</text>
  <text x="890" y="133" class="sub">MiniLM 384-d normalized</text>

  <rect x="1010" y="90" width="120" height="62" rx="8" class="node"/>
  <text x="1070" y="118" class="txt">FAISS</text>
  <text x="1070" y="133" class="sub">IndexFlatIP</text>

  <rect x="1150" y="82" width="95" height="78" rx="8" class="node"/>
  <text x="1198" y="108" class="txt">Saved</text>
  <text x="1198" y="124" class="sub">faiss_index.bin</text>
  <text x="1198" y="138" class="sub">metadata.pkl</text>

  <path d="M180 121 L210 121" class="arrow"/>
  <path d="M370 121 L400 121" class="arrow"/>
  <path d="M550 121 L580 121" class="arrow"/>
  <path d="M770 121 L800 121" class="arrow"/>
  <path d="M980 121 L1010 121" class="arrow"/>
  <path d="M1130 121 L1150 121" class="arrow"/>

  <rect x="40" y="390" width="140" height="62" rx="8" class="node"/>
  <text x="110" y="418" class="txt">User query</text>
  <text x="110" y="433" class="sub">Streamlit chat input</text>

  <rect x="210" y="390" width="170" height="62" rx="8" class="node"/>
  <text x="295" y="418" class="txt">Load pipeline</text>
  <text x="295" y="433" class="sub">cache retriever/store</text>

  <rect x="410" y="390" width="160" height="62" rx="8" class="node"/>
  <text x="490" y="418" class="txt">General query check</text>
  <text x="490" y="433" class="sub">greeting/thanks fast path</text>

  <rect x="600" y="390" width="165" height="62" rx="8" class="node"/>
  <text x="682" y="418" class="txt">Query normalize</text>
  <text x="682" y="433" class="sub">Hindi/Hinglish to EN</text>

  <rect x="795" y="390" width="155" height="62" rx="8" class="node"/>
  <text x="872" y="418" class="txt">Retriever search</text>
  <text x="872" y="433" class="sub">embed + FAISS + filter</text>

  <rect x="980" y="390" width="145" height="62" rx="8" class="node"/>
  <text x="1052" y="418" class="txt">Context builder</text>
  <text x="1052" y="433" class="sub">source tags + cap</text>

  <rect x="1155" y="390" width="90" height="62" rx="8" class="node"/>
  <text x="1200" y="418" class="txt">Prompt</text>
  <text x="1200" y="433" class="sub">EN/HI + memory</text>

  <path d="M180 421 L210 421" class="arrow"/>
  <path d="M380 421 L410 421" class="arrow"/>
  <path d="M570 421 L600 421" class="arrow"/>
  <path d="M765 421 L795 421" class="arrow"/>
  <path d="M950 421 L980 421" class="arrow"/>
  <path d="M1125 421 L1155 421" class="arrow"/>

  <rect x="250" y="560" width="165" height="70" rx="8" class="node"/>
  <text x="332" y="590" class="txt">Groq generation</text>
  <text x="332" y="607" class="sub">primary + fallback</text>

  <rect x="445" y="560" width="170" height="70" rx="8" class="node"/>
  <text x="530" y="590" class="txt">Language enforcer</text>
  <text x="530" y="607" class="sub">rewrite on mismatch</text>

  <rect x="645" y="560" width="180" height="70" rx="8" class="node"/>
  <text x="735" y="590" class="txt">Fallback snippets</text>
  <text x="735" y="607" class="sub">if LLM unavailable</text>

  <rect x="855" y="560" width="150" height="70" rx="8" class="node"/>
  <text x="930" y="590" class="txt">Citations</text>
  <text x="930" y="607" class="sub">source/page/service</text>

  <rect x="1035" y="560" width="125" height="70" rx="8" class="node"/>
  <text x="1097" y="590" class="txt">UI render</text>
  <text x="1097" y="607" class="sub">answer + sources</text>

  <rect x="1190" y="560" width="70" height="70" rx="8" class="node"/>
  <text x="1225" y="590" class="txt">Memory</text>
  <text x="1225" y="607" class="sub">10 turns</text>

  <path d="M1200 452 L1200 506 L332 506 L332 560" class="arrow"/>
  <path d="M415 595 L445 595" class="arrow"/>
  <path d="M615 595 L645 595" class="arrow"/>
  <path d="M825 595 L855 595" class="arrow"/>
  <path d="M1005 595 L1035 595" class="arrow"/>
  <path d="M1160 595 L1190 595" class="arrow"/>

  <path d="M1198 160 L1198 250 L295 250 L295 390" class="arrow"/>
  <text x="306" y="262" class="note">one-time index handoff to runtime load</text>
</svg>
